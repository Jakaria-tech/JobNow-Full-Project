<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JobNow</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">JobNow<span>⚡</span></a>
        <div><a href="register.html">Register</a></div>
    </nav>

    <div class="auth-container">
        <h2>Account Login</h2>
        <form id="loginForm">
            <label>Email Address</label>
            <input type="email" id="loginEmail" placeholder="example@mail.com" required>

            <label>Password</label>
            <input type="password" id="loginPass" placeholder="******" required>

            <button type="submit">Login</button>
        </form>
        <p style="text-align: center; margin-top: 15px; font-size: 14px;">New to JobNow? <a href="register.html" style="color: #0284c7; text-decoration: none; font-weight:600;">Create an account</a></p>
    </div>

    <script src="app.js"></script>
</body>
</html>

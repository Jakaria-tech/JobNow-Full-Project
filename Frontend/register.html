<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - JobNow</title>
    <link rel="stylesheet" href="css/Style.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">JobNow<span>⚡</span></a>
        <div><a href="login.html">Login</a></div>
    </nav>

    <div class="auth-container">
        <h2>Create an Account</h2>
        <form id="registerForm">
            <label>Full Name</label>
            <input type="text" id="regName" placeholder="e.g. John Doe" required>

            <label>Email Address</label>
            <input type="email" id="regEmail" placeholder="example@mail.com" required>

            <label>Password</label>
            <input type="password" id="regPass" placeholder="******" required>

            <label>Account Type</label>
            <select id="regRole">
                <option value="jobseeker">Job Seeker (Looking for work)</option>
                <option value="recruiter">Recruiter (Looking to hire)</option>
            </select>

            <button type="submit">Sign Up</button>
        </form>
        <p style="text-align: center; margin-top: 15px; font-size: 14px;">Already have an account? <a href="login.html" style="color: #0284c7; text-decoration: none; font-weight:600;">Login here</a></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
